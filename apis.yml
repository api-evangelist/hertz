description: >-
  The Hertz Corporation is a global vehicle rental company operating the Hertz, Dollar and Thrifty
  brands from airport and neighbourhood locations in roughly 160 countries, renting cars, vans and
  trucks to leisure, corporate, government and rideshare customers and running the Hertz Gold Plus
  Rewards loyalty programme. Hertz publishes no public developer programme: probing on 2026-09-13
  found no developer portal, no OpenAPI or other machine-readable contract, no SDKs, no first-party
  MCP server and no /.well-known/ discovery documents on any Hertz host. Third-party integrators
  reach Hertz rates and availability through the global distribution systems — Amadeus, Sabre and
  Travelport — which Hertz's own Travel Agent GDS Tools page directs them to, rather than through a
  first-party API.
